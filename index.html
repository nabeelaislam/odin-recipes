<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Family Recipes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <h1>Family Recipes</h1>

  <div class="filters">
    <input
      type="text"
      id="searchInput"
      placeholder="Search recipes…"
    />

    <details class="filter-dropdown">
      <summary>Origin</summary>
      <label><input type="checkbox" value="Baba" class="filter-origin" /> Baba</label>
      <label><input type="checkbox" value="Mommy" class="filter-origin" /> Mommy</label>
    </details>

    <details class="filter-dropdown">
      <summary>Category</summary>
      <label><input type="checkbox" value="Curry" class="filter-category" /> Curry</label>
      <label><input type="checkbox" value="Rice" class="filter-category" /> Rice</label>
      <label><input type="checkbox" value="Vegetarian" class="filter-category" /> Vegetarian</label>
      <label><input type="checkbox" value="Chicken" class="filter-category" /> Chicken</label>
      <label><input type="checkbox" value="Seafood" class="filter-category" /> Seafood</label>
      <label><input type="checkbox" value="Pakistani" class="filter-category" /> Pakistani</label>
      <label><input type="checkbox" value="Bengali" class="filter-category" /> Bengali</label>
      <label><input type="checkbox" value="Persian" class="filter-category" /> Persian</label>
    </details>
  </div>

  <div id="recipe-grid"></div>

  <!-- JS FILE -->
  <script src="js/recipes.js"></script>
</body>
</html>
